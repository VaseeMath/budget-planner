<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#111827">
  <title>Budget Planner</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💰</text></svg>">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/recharts/2.10.3/Recharts.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #111827; overscroll-behavior: none; }
    .recharts-tooltip-wrapper { z-index: 1000; }
    input, select { font-size: 16px !important; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #1f2937; }
    ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 3px; }
    @media (max-width: 640px) { .hide-mobile { display: none !important; } }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;
    const { PieChart, Pie, Cell, BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer } = Recharts;

    const Icon = ({ name, size = 24, className = '' }) => {
      const ref = useRef(null);
      useEffect(() => {
        if (ref.current && lucide.icons[name]) {
          ref.current.innerHTML = '';
          const icon = lucide.createElement(lucide.icons[name]);
          icon.setAttribute('width', size);
          icon.setAttribute('height', size);
          ref.current.appendChild(icon);
        }
      }, [name, size]);
      return <span ref={ref} className={`inline-flex items-center justify-center ${className}`} />;
    };

    const FREQUENCIES = ['weekly', 'fortnightly', 'monthly', 'yearly', 'one-off'];
    const INCOME_CATEGORIES = ['Salary', 'Wages', 'Freelance', 'Investment', 'Government Benefits', 'Rental Income', 'Business Income', 'Dividends', 'Other'];
    const EXPENSE_CATEGORIES = ['Housing', 'Utilities', 'Groceries', 'Transport', 'Insurance', 'Healthcare', 'Entertainment', 'Dining Out', 'Subscriptions', 'Debt Repayment', 'Savings', 'Education', 'Personal Care', 'Clothing', 'Gifts', 'Childcare', 'Pet Care', 'Other'];
    const TO_WEEKLY = { 'weekly': 1, 'fortnightly': 0.5, 'monthly': 12/52, 'yearly': 1/52, 'one-off': 0 };
    const FROM_WEEKLY = { 'weekly': 1, 'fortnightly': 2, 'monthly': 52/12, 'yearly': 52 };
    const COLORS = ['#3B82F6', '#10B981', '#F59E0B', '#EF4444', '#8B5CF6', '#EC4899', '#06B6D4', '#84CC16', '#F97316', '#6366F1', '#14B8A6', '#A855F7', '#F43F5E', '#0EA5E9', '#22C55E', '#FBBF24', '#E11D48', '#7C3AED'];

    const generateId = () => Math.random().toString(36).substr(2, 9);
    const formatCurrency = (amount) => {
      const isNeg = amount < 0;
      const fmt = new Intl.NumberFormat('en-AU', { style: 'currency', currency: 'AUD', minimumFractionDigits: 2 }).format(Math.abs(amount));
      return isNeg ? `-${fmt}` : fmt;
    };
    const convertAmount = (amount, fromFreq, toFreq) => {
      if (fromFreq === 'one-off' || toFreq === 'one-off') return amount;
      return amount * TO_WEEKLY[fromFreq] * FROM_WEEKLY[toFreq];
    };
    const capitalise = (str) => str.charAt(0).toUpperCase() + str.slice(1);
    const saveToStorage = (key, data) => { try { localStorage.setItem(key, JSON.stringify(data)); } catch (e) {} };
    const loadFromStorage = (key, def) => { try { const s = localStorage.getItem(key); return s ? JSON.parse(s) : def; } catch (e) { return def; } };

    function BudgetApp() {
      const [incomes, setIncomes] = useState(() => loadFromStorage('budget_incomes', []));
      const [expenses, setExpenses] = useState(() => loadFromStorage('budget_expenses', []));
      const [viewFrequency, setViewFrequency] = useState('monthly');
      const [activeTab, setActiveTab] = useState('dashboard');
      const [editingItem, setEditingItem] = useState(null);
      const [showExportMenu, setShowExportMenu] = useState(false);
      const [showDeleteConfirm, setShowDeleteConfirm] = useState(null);
      const [incomeForm, setIncomeForm] = useState({ name: '', amount: '', category: 'Salary', frequency: 'monthly' });
      const [expenseForm, setExpenseForm] = useState({ name: '', amount: '', category: 'Housing', frequency: 'monthly' });

      useEffect(() => { saveToStorage('budget_incomes', incomes); }, [incomes]);
      useEffect(() => { saveToStorage('budget_expenses', expenses); }, [expenses]);

      const calculations = useMemo(() => {
        const recurringIncomes = incomes.filter(i => i.frequency !== 'one-off');
        const recurringExpenses = expenses.filter(e => e.frequency !== 'one-off');
        const oneOffIncomes = incomes.filter(i => i.frequency === 'one-off');
        const oneOffExpenses = expenses.filter(e => e.frequency === 'one-off');
        const totalIncome = recurringIncomes.reduce((sum, item) => sum + convertAmount(item.amount, item.frequency, viewFrequency), 0);
        const totalExpenses = recurringExpenses.reduce((sum, item) => sum + convertAmount(item.amount, item.frequency, viewFrequency), 0);
        const netPosition = totalIncome - totalExpenses;
        const totalOneOffIncome = oneOffIncomes.reduce((sum, item) => sum + item.amount, 0);
        const totalOneOffExpenses = oneOffExpenses.reduce((sum, item) => sum + item.amount, 0);
        const expensesByCategory = {};
        recurringExpenses.forEach(item => {
          const converted = convertAmount(item.amount, item.frequency, viewFrequency);
          expensesByCategory[item.category] = (expensesByCategory[item.category] || 0) + converted;
        });
        const expensePieData = Object.entries(expensesByCategory)
          .map(([name, value]) => ({ name, value, percentage: totalExpenses > 0 ? (value / totalExpenses * 100).toFixed(1) : 0 }))
          .sort((a, b) => b.value - a.value);
        const barData = [
          { name: 'Income', amount: totalIncome, fill: '#10B981' },
          { name: 'Expenses', amount: totalExpenses, fill: '#EF4444' }
        ];
        return { totalIncome, totalExpenses, netPosition, totalOneOffIncome, totalOneOffExpenses, expensePieData, barData, recurringIncomes, recurringExpenses, oneOffIncomes, oneOffExpenses };
      }, [incomes, expenses, viewFrequency]);

      const addIncome = (e) => {
        e.preventDefault();
        if (!incomeForm.name || !incomeForm.amount || incomes.length >= 50) return;
        setIncomes([...incomes, { id: generateId(), name: incomeForm.name, amount: parseFloat(incomeForm.amount), category: incomeForm.category, frequency: incomeForm.frequency, type: 'income' }]);
        setIncomeForm({ name: '', amount: '', category: 'Salary', frequency: 'monthly' });
      };

      const addExpense = (e) => {
        e.preventDefault();
        if (!expenseForm.name || !expenseForm.amount || expenses.length >= 50) return;
        setExpenses([...expenses, { id: generateId(), name: expenseForm.name, amount: parseFloat(expenseForm.amount), category: expenseForm.category, frequency: expenseForm.frequency, type: 'expense' }]);
        setExpenseForm({ name: '', amount: '', category: 'Housing', frequency: 'monthly' });
      };

      const deleteItem = (id, type) => {
        if (type === 'income') setIncomes(incomes.filter(i => i.id !== id));
        else setExpenses(expenses.filter(e => e.id !== id));
        setShowDeleteConfirm(null);
      };

      const saveEdit = () => {
        if (!editingItem) return;
        if (editingItem.type === 'income') setIncomes(incomes.map(i => i.id === editingItem.id ? editingItem : i));
        else setExpenses(expenses.map(e => e.id === editingItem.id ? editingItem : e));
        setEditingItem(null);
      };

      const exportToCSV = () => {
        const headers = ['Type', 'Name', 'Category', 'Original Amount', 'Frequency', `${capitalise(viewFrequency)} Amount`];
        const rows = [
          ...incomes.map(i => ['Income', `"${i.name}"`, i.category, i.amount.toFixed(2), capitalise(i.frequency), i.frequency === 'one-off' ? i.amount.toFixed(2) : convertAmount(i.amount, i.frequency, viewFrequency).toFixed(2)]),
          ...expenses.map(e => ['Expense', `"${e.name}"`, e.category, e.amount.toFixed(2), capitalise(e.frequency), e.frequency === 'one-off' ? e.amount.toFixed(2) : convertAmount(e.amount, e.frequency, viewFrequency).toFixed(2)])
        ];
        rows.push([], ['Summary'], [`Total ${capitalise(viewFrequency)} Income`, '', '', '', '', calculations.totalIncome.toFixed(2)], [`Total ${capitalise(viewFrequency)} Expenses`, '', '', '', '', calculations.totalExpenses.toFixed(2)], [`Net ${capitalise(viewFrequency)} Position`, '', '', '', '', calculations.netPosition.toFixed(2)]);
        const blob = new Blob([[headers, ...rows].map(r => r.join(',')).join('\n')], { type: 'text/csv' });
        const link = document.createElement('a'); link.href = URL.createObjectURL(blob); link.download = `budget_${new Date().toISOString().split('T')[0]}.csv`; link.click();
        setShowExportMenu(false);
      };

      const exportToPDF = () => {
        const html = `<!DOCTYPE html><html><head><title>Budget Report</title><style>body{font-family:Arial,sans-serif;padding:30px;color:#333;max-width:800px;margin:0 auto}h1{border-bottom:3px solid #3b82f6;padding-bottom:10px}h2{margin-top:28px;color:#555}.summary{background:#f5f5f5;padding:20px;border-radius:10px;display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin:20px 0;text-align:center}.summary-label{font-size:12px;color:#666;text-transform:uppercase}.summary-value{font-size:22px;font-weight:700}.green{color:#059669}.red{color:#dc2626}table{width:100%;border-collapse:collapse;margin:15px 0}th,td{padding:10px;text-align:left;border-bottom:1px solid #ddd}th{background:#f9f9f9;font-size:11px;text-transform:uppercase;color:#666}</style></head><body><h1>💰 Budget Report</h1><p style="color:#888">Generated: ${new Date().toLocaleDateString('en-AU', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })} | View: ${capitalise(viewFrequency)}</p><div class="summary"><div><div class="summary-label">${capitalise(viewFrequency)} Income</div><div class="summary-value green">${formatCurrency(calculations.totalIncome)}</div></div><div><div class="summary-label">${capitalise(viewFrequency)} Expenses</div><div class="summary-value red">${formatCurrency(calculations.totalExpenses)}</div></div><div><div class="summary-label">Net Position</div><div class="summary-value ${calculations.netPosition >= 0 ? 'green' : 'red'}">${formatCurrency(calculations.netPosition)}</div></div></div><h2>📈 Income (${incomes.length})</h2><table><tr><th>Name</th><th>Category</th><th>Frequency</th><th style="text-align:right">Original</th><th style="text-align:right">${capitalise(viewFrequency)}</th></tr>${incomes.map(i => `<tr><td><strong>${i.name}</strong></td><td>${i.category}</td><td>${capitalise(i.frequency)}</td><td style="text-align:right">${formatCurrency(i.amount)}</td><td style="text-align:right" class="green">${i.frequency === 'one-off' ? '—' : formatCurrency(convertAmount(i.amount, i.frequency, viewFrequency))}</td></tr>`).join('')}</table><h2>📉 Expenses (${expenses.length})</h2><table><tr><th>Name</th><th>Category</th><th>Frequency</th><th style="text-align:right">Original</th><th style="text-align:right">${capitalise(viewFrequency)}</th></tr>${expenses.map(e => `<tr><td><strong>${e.name}</strong></td><td>${e.category}</td><td>${capitalise(e.frequency)}</td><td style="text-align:right">${formatCurrency(e.amount)}</td><td style="text-align:right" class="red">${e.frequency === 'one-off' ? '—' : formatCurrency(convertAmount(e.amount, e.frequency, viewFrequency))}</td></tr>`).join('')}</table><h2>📊 Expense Breakdown</h2><table><tr><th>Category</th><th style="text-align:right">Amount</th><th style="text-align:right">%</th></tr>${calculations.expensePieData.map(item => `<tr><td><strong>${item.name}</strong></td><td style="text-align:right">${formatCurrency(item.value)}</td><td style="text-align:right">${item.percentage}%</td></tr>`).join('')}</table></body></html>`;
        const w = window.open('', '_blank'); w.document.write(html); w.document.close(); setTimeout(() => w.print(), 200);
        setShowExportMenu(false);
      };

      const CustomTooltip = ({ active, payload }) => {
        if (active && payload && payload.length) {
          return (
            <div className="bg-gray-800 px-4 py-3 rounded-xl shadow-2xl border border-gray-700">
              <p className="text-white font-semibold">{payload[0].name}</p>
              <p className="text-gray-300 text-lg font-bold">{formatCurrency(payload[0].value)}</p>
              {payload[0].payload.percentage && <p className="text-gray-400 text-xs">{payload[0].payload.percentage}%</p>}
            </div>
          );
        }
        return null;
      };

      const ItemRow = ({ item, type }) => {
        const isEditing = editingItem?.id === item.id;
        const converted = item.frequency === 'one-off' ? item.amount : convertAmount(item.amount, item.frequency, viewFrequency);

        if (isEditing) {
          return (
            <tr className="bg-blue-900/20">
              <td className="px-3 py-3"><input type="text" value={editingItem.name} onChange={(e) => setEditingItem({ ...editingItem, name: e.target.value })} className="w-full bg-gray-700 text-white px-3 py-2 rounded-lg border border-blue-500" /></td>
              <td className="px-3 py-3 hide-mobile"><select value={editingItem.category} onChange={(e) => setEditingItem({ ...editingItem, category: e.target.value })} className="w-full bg-gray-700 text-white px-3 py-2 rounded-lg border border-gray-600">{(type === 'income' ? INCOME_CATEGORIES : EXPENSE_CATEGORIES).map(cat => <option key={cat} value={cat}>{cat}</option>)}</select></td>
              <td className="px-3 py-3 hide-mobile"><select value={editingItem.frequency} onChange={(e) => setEditingItem({ ...editingItem, frequency: e.target.value })} className="w-full bg-gray-700 text-white px-3 py-2 rounded-lg border border-gray-600">{FREQUENCIES.map(f => <option key={f} value={f}>{capitalise(f)}</option>)}</select></td>
              <td className="px-3 py-3"><input type="number" step="0.01" value={editingItem.amount} onChange={(e) => setEditingItem({ ...editingItem, amount: parseFloat(e.target.value) || 0 })} className="w-full bg-gray-700 text-white px-3 py-2 rounded-lg border border-gray-600" /></td>
              <td className="px-3 py-3 text-gray-500 hide-mobile">—</td>
              <td className="px-3 py-3">
                <div className="flex gap-2">
                  <button onClick={saveEdit} className="p-2 bg-green-600 hover:bg-green-700 rounded-lg"><Icon name="check" size={16} /></button>
                  <button onClick={() => setEditingItem(null)} className="p-2 bg-gray-600 hover:bg-gray-700 rounded-lg"><Icon name="x" size={16} /></button>
                </div>
              </td>
            </tr>
          );
        }

        return (
          <tr className="border-b border-gray-700/50 hover:bg-gray-800/50 group">
            <td className="px-3 py-4"><div className="font-medium text-white">{item.name}</div><div className="sm:hidden text-xs text-gray-500 mt-1">{item.category} • {capitalise(item.frequency)}</div></td>
            <td className="px-3 py-4 hide-mobile"><span className="px-3 py-1 bg-gray-700 rounded-full text-xs text-gray-300">{item.category}</span></td>
            <td className="px-3 py-4 text-gray-400 text-sm hide-mobile">{capitalise(item.frequency)}</td>
            <td className="px-3 py-4 text-gray-400 text-sm hide-mobile">{formatCurrency(item.amount)}</td>
            <td className={`px-3 py-4 font-semibold ${type === 'income' ? 'text-green-400' : 'text-red-400'}`}>{item.frequency === 'one-off' ? <span className="text-gray-500">One-off</span> : formatCurrency(converted)}</td>
            <td className="px-3 py-4">
              <div className="flex gap-1 opacity-60 group-hover:opacity-100">
                <button onClick={() => setEditingItem({ ...item })} className="p-2 text-gray-400 hover:text-blue-400 hover:bg-blue-400/10 rounded-lg"><Icon name="pencil" size={16} /></button>
                <button onClick={() => setShowDeleteConfirm({ id: item.id, type, name: item.name })} className="p-2 text-gray-400 hover:text-red-400 hover:bg-red-400/10 rounded-lg"><Icon name="trash-2" size={16} /></button>
              </div>
            </td>
          </tr>
        );
      };

      return (
        <div className="min-h-screen bg-gray-900 text-gray-100">
          {/* Header */}
          <header className="bg-gray-800/95 backdrop-blur border-b border-gray-700 sticky top-0 z-50">
            <div className="max-w-7xl mx-auto px-4 py-4">
              <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
                <div className="flex items-center gap-3">
                  <div className="p-2.5 bg-gradient-to-br from-blue-500 to-blue-600 rounded-xl shadow-lg shadow-blue-500/25"><Icon name="piggy-bank" size={26} /></div>
                  <div><h1 className="text-xl font-bold text-white">Budget Planner</h1><p className="text-xs text-gray-400">Track your finances</p></div>
                </div>
                <div className="flex items-center gap-3">
                  <div className="flex items-center gap-2 bg-gray-700/50 rounded-xl px-3 py-1">
                    <span className="text-xs text-gray-400">View:</span>
                    <select value={viewFrequency} onChange={(e) => setViewFrequency(e.target.value)} className="bg-transparent text-white py-2 pr-2 text-sm font-medium cursor-pointer focus:outline-none">
                      {FREQUENCIES.filter(f => f !== 'one-off').map(f => <option key={f} value={f} className="bg-gray-800">{capitalise(f)}</option>)}
                    </select>
                  </div>
                  <div className="relative">
                    <button onClick={() => setShowExportMenu(!showExportMenu)} className="flex items-center gap-2 px-4 py-2.5 bg-gradient-to-r from-blue-500 to-blue-600 hover:from-blue-600 hover:to-blue-700 text-white rounded-xl font-medium text-sm shadow-lg shadow-blue-500/25">
                      <Icon name="download" size={18} /><span className="hidden sm:inline">Export</span>
                    </button>
                    {showExportMenu && (
                      <>
                        <div className="fixed inset-0 z-40" onClick={() => setShowExportMenu(false)} />
                        <div className="absolute right-0 mt-2 w-52 bg-gray-800 rounded-xl shadow-2xl border border-gray-700 overflow-hidden z-50">
                          <button onClick={exportToCSV} className="w-full flex items-center gap-3 px-4 py-3.5 hover:bg-gray-700/80">
                            <div className="p-2 bg-green-500/20 rounded-lg"><Icon name="table" size={18} className="text-green-400" /></div>
                            <div><div className="font-medium text-sm">Export CSV</div><div className="text-xs text-gray-500">Spreadsheet</div></div>
                          </button>
                          <button onClick={exportToPDF} className="w-full flex items-center gap-3 px-4 py-3.5 hover:bg-gray-700/80">
                            <div className="p-2 bg-red-500/20 rounded-lg"><Icon name="file-text" size={18} className="text-red-400" /></div>
                            <div><div className="font-medium text-sm">Export PDF</div><div className="text-xs text-gray-500">Print report</div></div>
                          </button>
                        </div>
                      </>
                    )}
                  </div>
                </div>
              </div>
              <div className="flex gap-1 mt-4 -mb-4">
                {['dashboard', 'income', 'expenses'].map(tab => (
                  <button key={tab} onClick={() => setActiveTab(tab)} className={`px-5 py-3 rounded-t-xl font-medium text-sm transition-all ${activeTab === tab ? 'bg-gray-900 text-white shadow-lg' : 'text-gray-400 hover:text-white hover:bg-gray-700/50'}`}>
                    {tab === 'dashboard' && <Icon name="layout-dashboard" size={16} className="inline mr-2 -mt-0.5" />}
                    {tab === 'income' && <Icon name="trending-up" size={16} className="inline mr-2 -mt-0.5" />}
                    {tab === 'expenses' && <Icon name="trending-down" size={16} className="inline mr-2 -mt-0.5" />}
                    {capitalise(tab)}
                  </button>
                ))}
              </div>
            </div>
          </header>

          <main className="max-w-7xl mx-auto px-4 py-6">
            {/* Dashboard */}
            {activeTab === 'dashboard' && (
              <div className="space-y-6">
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                  <div className="bg-gradient-to-br from-gray-800 to-gray-800/50 rounded-2xl p-5 border border-gray-700/50 shadow-xl">
                    <div className="flex items-start justify-between">
                      <div><p className="text-gray-400 text-sm font-medium">{capitalise(viewFrequency)} Income</p><p className="text-3xl font-bold text-green-400 mt-2">{formatCurrency(calculations.totalIncome)}</p><p className="text-xs text-gray-500 mt-2">{calculations.recurringIncomes.length} recurring</p></div>
                      <div className="p-3 bg-green-500/20 rounded-xl"><Icon name="trending-up" size={24} className="text-green-400" /></div>
                    </div>
                  </div>
                  <div className="bg-gradient-to-br from-gray-800 to-gray-800/50 rounded-2xl p-5 border border-gray-700/50 shadow-xl">
                    <div className="flex items-start justify-between">
                      <div><p className="text-gray-400 text-sm font-medium">{capitalise(viewFrequency)} Expenses</p><p className="text-3xl font-bold text-red-400 mt-2">{formatCurrency(calculations.totalExpenses)}</p><p className="text-xs text-gray-500 mt-2">{calculations.recurringExpenses.length} recurring</p></div>
                      <div className="p-3 bg-red-500/20 rounded-xl"><Icon name="trending-down" size={24} className="text-red-400" /></div>
                    </div>
                  </div>
                  <div className="bg-gradient-to-br from-gray-800 to-gray-800/50 rounded-2xl p-5 border border-gray-700/50 shadow-xl">
                    <div className="flex items-start justify-between">
                      <div><p className="text-gray-400 text-sm font-medium">Net {capitalise(viewFrequency)}</p><p className={`text-3xl font-bold mt-2 ${calculations.netPosition >= 0 ? 'text-green-400' : 'text-red-400'}`}>{calculations.netPosition < 0 && '-'}{formatCurrency(Math.abs(calculations.netPosition))}</p><p className="text-xs text-gray-500 mt-2">{calculations.netPosition >= 0 ? '✨ Surplus' : '⚠️ Deficit'}</p></div>
                      <div className={`p-3 rounded-xl ${calculations.netPosition >= 0 ? 'bg-green-500/20' : 'bg-red-500/20'}`}><Icon name="wallet" size={24} className={calculations.netPosition >= 0 ? 'text-green-400' : 'text-red-400'} /></div>
                    </div>
                  </div>
                </div>

                {(calculations.oneOffIncomes.length > 0 || calculations.oneOffExpenses.length > 0) && (
                  <div className="bg-gray-800/30 rounded-xl p-4 border border-gray-700/50">
                    <div className="flex items-center gap-2 mb-3"><Icon name="calendar" size={16} className="text-gray-500" /><h3 className="text-sm font-medium text-gray-400">One-off Items</h3></div>
                    <div className="flex flex-wrap gap-x-8 gap-y-2">
                      <p className="text-sm"><span className="text-gray-400">Income:</span> <span className="text-green-400 font-semibold">{formatCurrency(calculations.totalOneOffIncome)}</span> <span className="text-gray-600">({calculations.oneOffIncomes.length})</span></p>
                      <p className="text-sm"><span className="text-gray-400">Expenses:</span> <span className="text-red-400 font-semibold">{formatCurrency(calculations.totalOneOffExpenses)}</span> <span className="text-gray-600">({calculations.oneOffExpenses.length})</span></p>
                    </div>
                  </div>
                )}

                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                  <div className="bg-gradient-to-br from-gray-800 to-gray-800/50 rounded-2xl p-5 border border-gray-700/50 shadow-xl">
                    <h3 className="text-lg font-semibold text-white mb-4 flex items-center gap-2"><Icon name="bar-chart-3" size={20} className="text-blue-400" />Income vs Expenses</h3>
                    {calculations.totalIncome > 0 || calculations.totalExpenses > 0 ? (
                      <ResponsiveContainer width="100%" height={280}>
                        <BarChart data={calculations.barData} barGap={8}>
                          <CartesianGrid strokeDasharray="3 3" stroke="#374151" vertical={false} />
                          <XAxis dataKey="name" stroke="#9CA3AF" tick={{ fontSize: 12 }} />
                          <YAxis stroke="#9CA3AF" tick={{ fontSize: 12 }} tickFormatter={(v) => `$${(v/1000).toFixed(0)}k`} />
                          <Tooltip content={<CustomTooltip />} cursor={{ fill: 'rgba(59,130,246,0.1)' }} />
                          <Bar dataKey="amount" radius={[8, 8, 0, 0]} maxBarSize={80}>{calculations.barData.map((e, i) => <Cell key={i} fill={e.fill} />)}</Bar>
                        </BarChart>
                      </ResponsiveContainer>
                    ) : (
                      <div className="h-[280px] flex flex-col items-center justify-center text-gray-500"><Icon name="bar-chart-3" size={48} className="opacity-30 mb-3" /><p>Add data to see chart</p></div>
                    )}
                  </div>
                  <div className="bg-gradient-to-br from-gray-800 to-gray-800/50 rounded-2xl p-5 border border-gray-700/50 shadow-xl">
                    <h3 className="text-lg font-semibold text-white mb-4 flex items-center gap-2"><Icon name="pie-chart" size={20} className="text-purple-400" />Expense Breakdown</h3>
                    {calculations.expensePieData.length > 0 ? (
                      <div className="flex flex-col sm:flex-row items-center">
                        <ResponsiveContainer width="100%" height={220} className="sm:w-1/2">
                          <PieChart><Pie data={calculations.expensePieData} cx="50%" cy="50%" innerRadius={55} outerRadius={85} paddingAngle={3} dataKey="value" strokeWidth={0}>{calculations.expensePieData.map((e, i) => <Cell key={i} fill={COLORS[i % COLORS.length]} />)}</Pie><Tooltip content={<CustomTooltip />} /></PieChart>
                        </ResponsiveContainer>
                        <div className="w-full sm:w-1/2 max-h-[220px] overflow-y-auto pr-2 mt-4 sm:mt-0">
                          {calculations.expensePieData.map((item, i) => (
                            <div key={item.name} className="flex items-center gap-3 py-2 border-b border-gray-700/30 last:border-0">
                              <div className="w-3 h-3 rounded-full flex-shrink-0" style={{ backgroundColor: COLORS[i % COLORS.length] }} />
                              <span className="text-sm text-gray-300 truncate flex-1">{item.name}</span>
                              <span className="text-sm text-gray-500 font-medium">{item.percentage}%</span>
                            </div>
                          ))}
                        </div>
                      </div>
                    ) : (
                      <div className="h-[220px] flex flex-col items-center justify-center text-gray-500"><Icon name="pie-chart" size={48} className="opacity-30 mb-3" /><p>Add expenses to see breakdown</p></div>
                    )}
                  </div>
                </div>

                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                  {[{ title: 'All Income', items: incomes, type: 'income', icon: 'trending-up', color: 'green' }, { title: 'All Expenses', items: expenses, type: 'expense', icon: 'trending-down', color: 'red' }].map(section => (
                    <div key={section.type} className="bg-gradient-to-br from-gray-800 to-gray-800/50 rounded-2xl border border-gray-700/50 shadow-xl overflow-hidden">
                      <div className="p-4 border-b border-gray-700/50 flex items-center justify-between">
                        <h3 className="font-semibold text-white flex items-center gap-2"><Icon name={section.icon} size={18} className={`text-${section.color}-400`} />{section.title}<span className="text-gray-500 text-sm font-normal ml-1">({section.items.length}/50)</span></h3>
                        <button onClick={() => setActiveTab(section.type === 'income' ? 'income' : 'expenses')} className="text-sm text-blue-400 hover:text-blue-300 font-medium flex items-center gap-1">Manage <Icon name="chevron-right" size={16} /></button>
                      </div>
                      <div className="overflow-x-auto max-h-96">
                        {section.items.length > 0 ? (
                          <table className="w-full">
                            <thead className="bg-gray-900/50 sticky top-0">
                              <tr>
                                <th className="px-3 py-3 text-left text-xs text-gray-400 font-semibold uppercase">Name</th>
                                <th className="px-3 py-3 text-left text-xs text-gray-400 font-semibold uppercase hide-mobile">Category</th>
                                <th className="px-3 py-3 text-left text-xs text-gray-400 font-semibold uppercase hide-mobile">Freq</th>
                                <th className="px-3 py-3 text-left text-xs text-gray-400 font-semibold uppercase hide-mobile">Original</th>
                                <th className="px-3 py-3 text-left text-xs text-gray-400 font-semibold uppercase">{capitalise(viewFrequency)}</th>
                                <th className="px-3 py-3 w-20"></th>
                              </tr>
                            </thead>
                            <tbody>{section.items.map(item => <ItemRow key={item.id} item={{...item, type: section.type}} type={section.type} />)}</tbody>
                          </table>
                        ) : (
                          <div className="p-10 text-center text-gray-500"><Icon name={section.icon} size={40} className="mx-auto mb-3 opacity-30" /><p>No {section.type} added yet</p></div>
                        )}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* Income Tab */}
            {activeTab === 'income' && (
              <div className="space-y-6">
                <div className="bg-gradient-to-br from-gray-800 to-gray-800/50 rounded-2xl p-5 border border-gray-700/50 shadow-xl">
                  <h3 className="text-lg font-semibold text-white mb-5 flex items-center gap-2"><Icon name="plus-circle" size={20} className="text-green-400" />Add Income</h3>
                  <form onSubmit={addIncome} className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4">
                    <div><label className="block text-sm text-gray-400 mb-2 font-medium">Name</label><input type="text" value={incomeForm.name} onChange={(e) => setIncomeForm({ ...incomeForm, name: e.target.value })} placeholder="e.g., Salary" className="w-full bg-gray-700/50 text-white px-4 py-3 rounded-xl border border-gray-600 focus:border-green-500 focus:outline-none" required /></div>
                    <div><label className="block text-sm text-gray-400 mb-2 font-medium">Amount ($)</label><input type="number" step="0.01" min="0" value={incomeForm.amount} onChange={(e) => setIncomeForm({ ...incomeForm, amount: e.target.value })} placeholder="0.00" className="w-full bg-gray-700/50 text-white px-4 py-3 rounded-xl border border-gray-600 focus:border-green-500 focus:outline-none" required /></div>
                    <div><label className="block text-sm text-gray-400 mb-2 font-medium">Category</label><select value={incomeForm.category} onChange={(e) => setIncomeForm({ ...incomeForm, category: e.target.value })} className="w-full bg-gray-700/50 text-white px-4 py-3 rounded-xl border border-gray-600 focus:border-green-500 focus:outline-none">{INCOME_CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}</select></div>
                    <div><label className="block text-sm text-gray-400 mb-2 font-medium">Frequency</label><select value={incomeForm.frequency} onChange={(e) => setIncomeForm({ ...incomeForm, frequency: e.target.value })} className="w-full bg-gray-700/50 text-white px-4 py-3 rounded-xl border border-gray-600 focus:border-green-500 focus:outline-none">{FREQUENCIES.map(f => <option key={f} value={f}>{capitalise(f)}</option>)}</select></div>
                    <div className="flex items-end"><button type="submit" disabled={incomes.length >= 50} className="w-full flex items-center justify-center gap-2 px-4 py-3 bg-gradient-to-r from-green-500 to-green-600 hover:from-green-600 hover:to-green-700 disabled:from-gray-600 disabled:to-gray-600 text-white rounded-xl font-semibold shadow-lg shadow-green-500/25 disabled:shadow-none"><Icon name="plus" size={18} />Add Income</button></div>
                  </form>
                </div>
                <div className="bg-gradient-to-br from-gray-800 to-gray-800/50 rounded-2xl border border-gray-700/50 shadow-xl overflow-hidden">
                  <div className="p-4 border-b border-gray-700/50"><h3 className="font-semibold text-white flex items-center gap-2"><Icon name="list" size={18} className="text-green-400" />Income Items<span className="text-gray-500 text-sm font-normal ml-1">({incomes.length}/50)</span></h3></div>
                  <div className="overflow-x-auto">
                    {incomes.length > 0 ? (
                      <table className="w-full">
                        <thead className="bg-gray-900/50"><tr><th className="px-3 py-3 text-left text-xs text-gray-400 font-semibold uppercase">Name</th><th className="px-3 py-3 text-left text-xs text-gray-400 font-semibold uppercase hide-mobile">Category</th><th className="px-3 py-3 text-left text-xs text-gray-400 font-semibold uppercase hide-mobile">Frequency</th><th className="px-3 py-3 text-left text-xs text-gray-400 font-semibold uppercase hide-mobile">Original</th><th className="px-3 py-3 text-left text-xs text-gray-400 font-semibold uppercase">{capitalise(viewFrequency)}</th><th className="px-3 py-3 w-24">Actions</th></tr></thead>
                        <tbody>{incomes.map(item => <ItemRow key={item.id} item={{...item, type: 'income'}} type="income" />)}</tbody>
                      </table>
                    ) : (
                      <div className="p-16 text-center text-gray-500"><Icon name="trending-up" size={56} className="mx-auto mb-4 opacity-20" /><p className="text-lg">No income items yet</p><p className="text-sm text-gray-600 mt-2">Add your first income above</p></div>
                    )}
                  </div>
                </div>
              </div>
            )}

            {/* Expenses Tab */}
            {activeTab === 'expenses' && (
              <div className="space-y-6">
                <div className="bg-gradient-to-br from-gray-800 to-gray-800/50 rounded-2xl p-5 border border-gray-700/50 shadow-xl">
                  <h3 className="text-lg font-semibold text-white mb-5 flex items-center gap-2"><Icon name="plus-circle" size={20} className="text-red-400" />Add Expense</h3>
                  <form onSubmit={addExpense} className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4">
                    <div><label className="block text-sm text-gray-400 mb-2 font-medium">Name</label><input type="text" value={expenseForm.name} onChange={(e) => setExpenseForm({ ...expenseForm, name: e.target.value })} placeholder="e.g., Rent" className="w-full bg-gray-700/50 text-white px-4 py-3 rounded-xl border border-gray-600 focus:border-red-500 focus:outline-none" required /></div>
                    <div><label className="block text-sm text-gray-400 mb-2 font-medium">Amount ($)</label><input type="number" step="0.01" min="0" value={expenseForm.amount} onChange={(e) => setExpenseForm({ ...expenseForm, amount: e.target.value })} placeholder="0.00" className="w-full bg-gray-700/50 text-white px-4 py-3 rounded-xl border border-gray-600 focus:border-red-500 focus:outline-none" required /></div>
                    <div><label className="block text-sm text-gray-400 mb-2 font-medium">Category</label><select value={expenseForm.category} onChange={(e) => setExpenseForm({ ...expenseForm, category: e.target.value })} className="w-full bg-gray-700/50 text-white px-4 py-3 rounded-xl border border-gray-600 focus:border-red-500 focus:outline-none">{EXPENSE_CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}</select></div>
                    <div><label className="block text-sm text-gray-400 mb-2 font-medium">Frequency</label><select value={expenseForm.frequency} onChange={(e) => setExpenseForm({ ...expenseForm, frequency: e.target.value })} className="w-full bg-gray-700/50 text-white px-4 py-3 rounded-xl border border-gray-600 focus:border-red-500 focus:outline-none">{FREQUENCIES.map(f => <option key={f} value={f}>{capitalise(f)}</option>)}</select></div>
                    <div className="flex items-end"><button type="submit" disabled={expenses.length >= 50} className="w-full flex items-center justify-center gap-2 px-4 py-3 bg-gradient-to-r from-red-500 to-red-600 hover:from-red-600 hover:to-red-700 disabled:from-gray-600 disabled:to-gray-600 text-white rounded-xl font-semibold shadow-lg shadow-red-500/25 disabled:shadow-none"><Icon name="plus" size={18} />Add Expense</button></div>
                  </form>
                </div>
                <div className="bg-gradient-to-br from-gray-800 to-gray-800/50 rounded-2xl border border-gray-700/50 shadow-xl overflow-hidden">
                  <div className="p-4 border-b border-gray-700/50"><h3 className="font-semibold text-white flex items-center gap-2"><Icon name="list" size={18} className="text-red-400" />Expense Items<span className="text-gray-500 text-sm font-normal ml-1">({expenses.length}/50)</span></h3></div>
                  <div className="overflow-x-auto">
                    {expenses.length > 0 ? (
                      <table className="w-full">
                        <thead className="bg-gray-900/50"><tr><th className="px-3 py-3 text-left text-xs text-gray-400 font-semibold uppercase">Name</th><th className="px-3 py-3 text-left text-xs text-gray-400 font-semibold uppercase hide-mobile">Category</th><th className="px-3 py-3 text-left text-xs text-gray-400 font-semibold uppercase hide-mobile">Frequency</th><th className="px-3 py-3 text-left text-xs text-gray-400 font-semibold uppercase hide-mobile">Original</th><th className="px-3 py-3 text-left text-xs text-gray-400 font-semibold uppercase">{capitalise(viewFrequency)}</th><th className="px-3 py-3 w-24">Actions</th></tr></thead>
                        <tbody>{expenses.map(item => <ItemRow key={item.id} item={{...item, type: 'expense'}} type="expense" />)}</tbody>
                      </table>
                    ) : (
                      <div className="p-16 text-center text-gray-500"><Icon name="trending-down" size={56} className="mx-auto mb-4 opacity-20" /><p className="text-lg">No expense items yet</p><p className="text-sm text-gray-600 mt-2">Add your first expense above</p></div>
                    )}
                  </div>
                </div>
              </div>
            )}
          </main>

          {/* Delete Modal */}
          {showDeleteConfirm && (
            <>
              <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-50" onClick={() => setShowDeleteConfirm(null)} />
              <div className="fixed inset-0 flex items-center justify-center z-50 p-4">
                <div className="bg-gray-800 rounded-2xl p-6 max-w-sm w-full shadow-2xl border border-gray-700">
                  <div className="flex items-center gap-3 mb-4">
                    <div className="p-3 bg-red-500/20 rounded-xl"><Icon name="trash-2" size={24} className="text-red-400" /></div>
                    <div><h3 className="text-lg font-semibold text-white">Delete Item</h3><p className="text-sm text-gray-400">This cannot be undone</p></div>
                  </div>
                  <p className="text-gray-300 mb-6">Delete "<span className="font-semibold text-white">{showDeleteConfirm.name}</span>"?</p>
                  <div className="flex gap-3">
                    <button onClick={() => setShowDeleteConfirm(null)} className="flex-1 px-4 py-3 bg-gray-700 hover:bg-gray-600 text-white rounded-xl font-medium">Cancel</button>
                    <button onClick={() => deleteItem(showDeleteConfirm.id, showDeleteConfirm.type)} className="flex-1 px-4 py-3 bg-red-600 hover:bg-red-700 text-white rounded-xl font-medium">Delete</button>
                  </div>
                </div>
              </div>
            </>
          )}
        </div>
      );
    }

    ReactDOM.render(<BudgetApp />, document.getElementById('root'));

    // Register service worker for PWA functionality
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then((registration) => {
            console.log('ServiceWorker registered:', registration.scope);
          })
          .catch((error) => {
            console.log('ServiceWorker registration failed:', error);
          });
      });
    }
  </script>
</body>
</html>
